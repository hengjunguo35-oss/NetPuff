name: Release (macOS)

# 推一个 v* 的 tag 即可自动构建并发布 macOS 发行版。
# 使用仓库自带的 GITHUB_TOKEN，无需任何额外密钥。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: 构建并发布 macOS 版
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 读取版本号
        id: ver
        run: |
          VERSION="$(sed -n 's/^APP_VERSION = "\(.*\)".*/\1/p' src/netpuff.py)"
          if [ -z "$VERSION" ]; then
            echo "错误：无法从 src/netpuff.py 读取 APP_VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "版本号：$VERSION / tag：${GITHUB_REF_NAME}"

      - name: 组装 NetPuff.app
        run: ./app/build-app.sh

      - name: 打包为 zip 并生成校验和
        id: pack
        run: |
          ZIP="NetPuff-${{ steps.ver.outputs.version }}-macOS.zip"
          # 用 ditto 而不是 zip：保留可执行权限与 macOS 元数据
          ditto -c -k --keepParent NetPuff.app "$ZIP"
          shasum -a 256 "$ZIP" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: 创建 Release 并上传产物
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          ZIP="${{ steps.pack.outputs.zip }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，改为追加/覆盖产物"
            gh release upload "$TAG" "$ZIP" SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" "$ZIP" SHA256SUMS.txt \
              --title "NetPuff ${{ steps.ver.outputs.version }} (macOS)" \
              --notes-file .github/release-notes-macos.md
          fi
