name: Windows Build

# 构建 Windows 单文件 exe 与 Inno Setup 安装包。
# - 手动触发：只上传 Actions 工件
# - 推 v* tag：等 Release 创建后，把 exe 与安装包附加到 Release
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: 构建 Windows 安装包
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: 构建单文件 exe
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name NetPuff --icon app/netpuff.ico
          --version-file app/version_info.txt
          --add-data "app/netpuff.ico;app" src/netpuff.py

      - name: 安装 Inno Setup
        run: choco install innosetup --no-progress -y

      - name: 编译安装包
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" app\installer.iss'

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: NetPuff-Windows
          path: |
            dist/NetPuff.exe
            dist/NetPuff-*-Setup.exe

      - name: 附加到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          for ($i = 0; $i -lt 60; $i++) {
            gh release view $tag *> $null
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 10
          }
          $setup = (Get-ChildItem "dist\NetPuff-*-Setup.exe" | Select-Object -First 1).FullName
          gh release upload $tag "dist\NetPuff.exe" $setup --clobber
