name: Windows Build

# 构建 Windows exe / 安装包，并顺带生成 macOS .app 的 zip（不依赖 macOS 机器）。
# - 手动触发：只上传 Actions 工件
# - 推 v* tag：自己创建 Release 并上传全部资产（含校验和）
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: 构建发行包
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: 构建单文件 exe
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name NetPuff --icon app/netpuff.ico
          --version-file app/version_info.txt
          --add-data "app/netpuff.ico;app" src/netpuff.py

      - name: 安装 Inno Setup
        run: choco install innosetup --no-progress -y

      - name: 编译安装包
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" app\installer.iss'

      - name: 构建 macOS 应用包（跨平台）
        run: python tools/build-mac-package.py

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: NetPuff-Release
          path: |
            dist/NetPuff.exe
            dist/NetPuff-*-Setup.exe
            dist/NetPuff-*-macOS.zip

      - name: 生成校验和
        shell: pwsh
        run: |
          $files = @("dist\NetPuff.exe") +
                   @(Get-ChildItem "dist\NetPuff-*-Setup.exe").FullName +
                   @(Get-ChildItem "dist\NetPuff-*-macOS.zip").FullName
          $lines = foreach ($f in $files) {
            "$((Get-FileHash $f -Algorithm SHA256).Hash.ToLower())  $(Split-Path $f -Leaf)"
          }
          $lines | Set-Content "dist\SHA256SUMS.txt" -Encoding ASCII
          Get-Content "dist\SHA256SUMS.txt"

      - name: 创建 Release 并上传
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $ver = (Select-String -Path "src\netpuff.py" -Pattern 'APP_VERSION = "([^"]+)"').Matches.Groups[1].Value
          (Get-Content ".github\release-notes.md" -Raw).Replace('{{VERSION}}', $ver) |
            Set-Content "RELEASE_NOTES.md" -Encoding UTF8
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "NetPuff $ver" --notes-file "RELEASE_NOTES.md"
          }
          $assets = @("dist\NetPuff.exe") +
                    @(Get-ChildItem "dist\NetPuff-*-Setup.exe").FullName +
                    @(Get-ChildItem "dist\NetPuff-*-macOS.zip").FullName +
                    @("dist\SHA256SUMS.txt")
          gh release upload $tag @assets --clobber
          gh release edit $tag --notes-file "RELEASE_NOTES.md"
