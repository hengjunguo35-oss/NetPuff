name: Release

# 手动触发：在 macOS 机器上构建 dmg / zip，并补传到已有 Release。
# 常规发行（含 Windows 安装包与 macOS zip）由 windows-build.yml 完成，不依赖 macOS 机器。
# 冒烟检查（含真实 Windows 环境）在 ci.yml 中，推 main 或提 PR 时即会运行。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 构建发行包并发布
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 读取版本号
        id: ver
        run: |
          VERSION="$(sed -n 's/^APP_VERSION = "\(.*\)".*/\1/p' src/netpuff.py)"
          if [ -z "$VERSION" ]; then
            echo "错误：无法从 src/netpuff.py 读取 APP_VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "版本号：$VERSION / tag：${GITHUB_REF_NAME}"

      - name: 组装 NetPuff.app
        run: ./app/build-app.sh

      - name: 打包 macOS（.zip + .dmg）
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          ZIP="NetPuff-${V}-macOS.zip"
          DMG="NetPuff-${V}.dmg"
          # zip：用 ditto 而非 zip，保留可执行权限与 macOS 元数据
          ditto -c -k --keepParent NetPuff.app "$ZIP"
          # dmg：内含 .app 与 /Applications 快捷方式，符合 macOS 安装习惯
          rm -rf dmg-root && mkdir dmg-root
          cp -R NetPuff.app dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "NetPuff" -srcfolder dmg-root -ov -format UDZO "$DMG"
          ls -lh "$ZIP" "$DMG"

      - name: 生成校验和
        run: |
          set -euo pipefail
          shasum -a 256 NetPuff-*.zip NetPuff-*.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 组织发行说明（替换 VERSION 占位符）
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          # 发行说明里的 {{VERSION}} 换成实际版本号，这样同一个文件可以跨版本复用，
          # 不会出现「v1.0.2 的正文里资产名还写着 1.0.1」这类过期问题。
          sed "s/{{VERSION}}/$V/g" .github/release-notes.md > RELEASE_NOTES.md
          if grep -q '{{VERSION}}' RELEASE_NOTES.md; then
            echo "::warning::RELEASE_NOTES.md 中仍有未替换的占位符"
          fi
          echo "--- 发行说明开头 12 行 ---"
          head -12 RELEASE_NOTES.md

      - name: 创建或更新 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          FILES="$(ls NetPuff-*.zip NetPuff-*.dmg)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # 已存在：补传 macOS 产物（覆盖同名文件），校验和由 windows-build.yml 统一生成
            gh release upload "$TAG" $FILES --clobber
            gh release edit "$TAG" --notes-file RELEASE_NOTES.md
          else
            gh release create "$TAG" $FILES \
              --title "NetPuff $V" \
              --notes-file RELEASE_NOTES.md
          fi
