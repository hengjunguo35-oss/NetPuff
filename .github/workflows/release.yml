name: Release

# 推一个 v* 的 tag 即自动构建 macOS / Windows 发行包并发布。
# 使用仓库自带的 GITHUB_TOKEN，无需任何额外密钥。
# 冒烟检查（含真实 Windows 环境）在 ci.yml 中，推 main 或提 PR 时即会运行。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 构建发行包并发布
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 读取版本号
        id: ver
        run: |
          VERSION="$(sed -n 's/^APP_VERSION = "\(.*\)".*/\1/p' src/netpuff.py)"
          if [ -z "$VERSION" ]; then
            echo "错误：无法从 src/netpuff.py 读取 APP_VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "版本号：$VERSION / tag：${GITHUB_REF_NAME}"

      - name: 组装 NetPuff.app
        run: ./app/build-app.sh

      - name: 打包 macOS（.zip + .dmg）
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          ZIP="NetPuff-${V}-macOS.zip"
          DMG="NetPuff-${V}.dmg"
          # zip：用 ditto 而非 zip，保留可执行权限与 macOS 元数据
          ditto -c -k --keepParent NetPuff.app "$ZIP"
          # dmg：内含 .app 与 /Applications 快捷方式，符合 macOS 安装习惯
          rm -rf dmg-root && mkdir dmg-root
          cp -R NetPuff.app dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "NetPuff" -srcfolder dmg-root -ov -format UDZO "$DMG"
          ls -lh "$ZIP" "$DMG"

      - name: 打包 Windows（功能未完善，供贡献者试用）
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          ZIP="NetPuff-${V}-Windows.zip"
          rm -f "$ZIP"   # zip 默认是「追加/更新」，必须先删除，否则旧条目会残留
          # 保持与仓库一致的目录结构，这样启动脚本里的
          # "..\src\netpuff.py" 相对路径才能正确解析
          rm -rf win-pkg && mkdir -p win-pkg/NetPuff/src win-pkg/NetPuff/app
          cp src/netpuff.py         win-pkg/NetPuff/src/
          # 包内改用 ASCII 文件名：zip 规范里非 ASCII 名称的兼容性在 Windows 上
          # 依赖 UTF-8 标志位，而 macOS 的 zip 并不设置它，会导致文件名乱码。
          # 内容与相对路径均与 app/启动NetPuff.bat 完全一致。
          cp app/启动NetPuff.bat     win-pkg/NetPuff/app/start-netpuff.bat
          cp app/README-Windows.txt win-pkg/NetPuff/
          (cd win-pkg && zip -r -X "../$ZIP" NetPuff)
          ls -lh "$ZIP"

      - name: 生成校验和
        run: |
          set -euo pipefail
          shasum -a 256 NetPuff-*.zip NetPuff-*.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 组织发行说明（把本版 CHANGELOG 段落放到最前面）
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          # 从两个 CHANGELOG 里抽出「当前版本」那一段：
          # 从 "## [V]" 开始，到第一条 --- 分隔线为止（分隔线本身去掉）。
          extract() {
            sed -n "/^## \[$V\]/,/^---\$/p" "$1" | sed '$d' | tail -n +2
          }
          ZH="$(extract CHANGELOG.md)"
          EN="$(extract CHANGELOG.en.md)"
          if [ -z "$(printf '%s' "$ZH" | tr -d '[:space:]')" ]; then
            echo "::warning::CHANGELOG.md 中找不到 $V 的条目"
            ZH="（CHANGELOG.md 中未找到 $V 的条目）"
          fi
          {
            echo "## 本次更新 · What's new in $V"
            echo
            printf '%s\n' "$ZH"
            echo
            echo "<details><summary>English</summary>"
            echo
            printf '%s\n' "$EN"
            echo
            echo "</details>"
            echo
            echo "---"
            echo
            cat .github/release-notes.md
          } > RELEASE_NOTES.md
          echo "--- 发行说明开头 22 行 ---"
          head -22 RELEASE_NOTES.md

      - name: 创建或更新 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          FILES="$(ls NetPuff-*.zip NetPuff-*.dmg SHA256SUMS.txt)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在：覆盖产物并刷新说明"
            gh release upload "$TAG" $FILES --clobber
            gh release edit "$TAG" --notes-file RELEASE_NOTES.md
          else
            gh release create "$TAG" $FILES \
              --title "NetPuff $V" \
              --notes-file RELEASE_NOTES.md
          fi
