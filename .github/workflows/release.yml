name: Release

# 推一个 v* 的 tag 即自动构建 macOS / Windows 发行包并发布。
# 使用仓库自带的 GITHUB_TOKEN，无需任何额外密钥。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 构建发行包并发布
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 读取版本号
        id: ver
        run: |
          VERSION="$(sed -n 's/^APP_VERSION = "\(.*\)".*/\1/p' src/netpuff.py)"
          if [ -z "$VERSION" ]; then
            echo "错误：无法从 src/netpuff.py 读取 APP_VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "版本号：$VERSION / tag：${GITHUB_REF_NAME}"

      - name: 组装 NetPuff.app
        run: ./app/build-app.sh

      - name: 打包 macOS（.zip + .dmg）
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          ZIP="NetPuff-${V}-macOS.zip"
          DMG="NetPuff-${V}.dmg"
          # zip：用 ditto 而非 zip，保留可执行权限与 macOS 元数据
          ditto -c -k --keepParent NetPuff.app "$ZIP"
          # dmg：内含 .app 与 /Applications 快捷方式，符合 macOS 安装习惯
          rm -rf dmg-root && mkdir dmg-root
          cp -R NetPuff.app dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "NetPuff" -srcfolder dmg-root -ov -format UDZO "$DMG"
          ls -lh "$ZIP" "$DMG"

      - name: 打包 Windows（功能未完善，供贡献者试用）
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          ZIP="NetPuff-${V}-Windows.zip"
          rm -f "$ZIP"   # zip 默认是「追加/更新」，必须先删除，否则旧条目会残留
          # 保持与仓库一致的目录结构，这样启动脚本里的
          # "..\src\netpuff.py" 相对路径才能正确解析
          rm -rf win-pkg && mkdir -p win-pkg/NetPuff/src win-pkg/NetPuff/app
          cp src/netpuff.py         win-pkg/NetPuff/src/
          # 包内改用 ASCII 文件名：zip 规范里非 ASCII 名称的兼容性在 Windows 上
          # 依赖 UTF-8 标志位，而 macOS 的 zip 并不设置它，会导致文件名乱码。
          # 内容与相对路径均与 app/启动NetPuff.bat 完全一致。
          cp app/启动NetPuff.bat     win-pkg/NetPuff/app/start-netpuff.bat
          cp app/README-Windows.txt win-pkg/NetPuff/
          (cd win-pkg && zip -r -X "../$ZIP" NetPuff)
          ls -lh "$ZIP"

      - name: 生成校验和
        run: |
          set -euo pipefail
          shasum -a 256 NetPuff-*.zip NetPuff-*.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 创建 Release 并上传全部产物
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          FILES="$(ls NetPuff-*.zip NetPuff-*.dmg SHA256SUMS.txt)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，改为追加/覆盖产物"
            gh release upload "$TAG" $FILES --clobber
          else
            gh release create "$TAG" $FILES \
              --title "NetPuff $V" \
              --notes-file .github/release-notes.md
          fi

  # Windows 目前无法在 macOS 上做功能验证，这里补一个真实 Windows 环境的冒烟检查。
  # 标为 continue-on-error：结果仅供参考，绝不阻塞发行。
  windows-smoke:
    name: Windows 冒烟检查（不阻塞发布）
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 语法与版本号检查
        shell: pwsh
        run: |
          python -c "import ast; ast.parse(open('src/netpuff.py', encoding='utf-8').read()); print('语法 OK')"
          python -c "import re; s = open('src/netpuff.py', encoding='utf-8').read(); print('APP_VERSION =', re.search(r'APP_VERSION = \"([^\"]+)\"', s).group(1))"

      - name: CLI 冒烟检查（--help / direct）
        shell: pwsh
        run: |
          python src/netpuff.py --help
          python src/netpuff.py direct

      - name: 验证 Windows 注册表读取路径（只读，不改系统设置）
        shell: pwsh
        run: python src/netpuff.py status

      - name: 验证 .bat 行尾为 CRLF
        shell: pwsh
        run: |
          $bytes = [IO.File]::ReadAllBytes("app/启动NetPuff.bat")
          $crlf = 0
          for ($i = 0; $i -lt $bytes.Length - 1; $i++) {
            if ($bytes[$i] -eq 13 -and $bytes[$i + 1] -eq 10) { $crlf++ }
          }
          $lfTotal = ($bytes | Where-Object { $_ -eq 10 }).Count
          $bareLf = $lfTotal - $crlf
          Write-Host "CRLF=$crlf  纯LF=$bareLf"
          if ($bareLf -ne 0) {
            throw "批处理文件含 $bareLf 个纯 LF 行尾，Windows 下可能解析异常"
          }
