name: Release

# 推一个 v* 的 tag 即自动构建 macOS / Windows 发行包并发布。
# 使用仓库自带的 GITHUB_TOKEN，无需任何额外密钥。
# 冒烟检查（含真实 Windows 环境）在 ci.yml 中，推 main 或提 PR 时即会运行。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 构建发行包并发布
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 读取版本号
        id: ver
        run: |
          VERSION="$(sed -n 's/^APP_VERSION = "\(.*\)".*/\1/p' src/netpuff.py)"
          if [ -z "$VERSION" ]; then
            echo "错误：无法从 src/netpuff.py 读取 APP_VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "版本号：$VERSION / tag：${GITHUB_REF_NAME}"

      - name: 组装 NetPuff.app
        run: ./app/build-app.sh

      - name: 打包 macOS（.zip + .dmg）
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          ZIP="NetPuff-${V}-macOS.zip"
          DMG="NetPuff-${V}.dmg"
          # zip：用 ditto 而非 zip，保留可执行权限与 macOS 元数据
          ditto -c -k --keepParent NetPuff.app "$ZIP"
          # dmg：内含 .app 与 /Applications 快捷方式，符合 macOS 安装习惯
          rm -rf dmg-root && mkdir dmg-root
          cp -R NetPuff.app dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "NetPuff" -srcfolder dmg-root -ov -format UDZO "$DMG"
          ls -lh "$ZIP" "$DMG"

      - name: 打包 Windows（功能未完善，供贡献者试用）
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          ZIP="NetPuff-${V}-Windows.zip"
          rm -f "$ZIP"   # zip 默认是「追加/更新」，必须先删除，否则旧条目会残留
          # 保持与仓库一致的目录结构，这样启动脚本里的
          # "..\src\netpuff.py" 相对路径才能正确解析
          rm -rf win-pkg && mkdir -p win-pkg/NetPuff/src win-pkg/NetPuff/app
          cp src/netpuff.py         win-pkg/NetPuff/src/
          # 包内改用 ASCII 文件名：zip 规范里非 ASCII 名称的兼容性在 Windows 上
          # 依赖 UTF-8 标志位，而 macOS 的 zip 并不设置它，会导致文件名乱码。
          # 内容与相对路径均与 app/启动NetPuff.bat 完全一致。
          cp app/启动NetPuff.bat     win-pkg/NetPuff/app/start-netpuff.bat
          cp app/README-Windows.txt win-pkg/NetPuff/
          (cd win-pkg && zip -r -X "../$ZIP" NetPuff)
          ls -lh "$ZIP"

      - name: 生成校验和
        run: |
          set -euo pipefail
          shasum -a 256 NetPuff-*.zip NetPuff-*.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 组织发行说明（替换 VERSION 占位符）
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          # 发行说明里的 {{VERSION}} 换成实际版本号，这样同一个文件可以跨版本复用，
          # 不会出现「v1.0.2 的正文里资产名还写着 1.0.1」这类过期问题。
          sed "s/{{VERSION}}/$V/g" .github/release-notes.md > RELEASE_NOTES.md
          if grep -q '{{VERSION}}' RELEASE_NOTES.md; then
            echo "::warning::RELEASE_NOTES.md 中仍有未替换的占位符"
          fi
          echo "--- 发行说明开头 12 行 ---"
          head -12 RELEASE_NOTES.md

      - name: 创建或更新 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          FILES="$(ls NetPuff-*.zip NetPuff-*.dmg SHA256SUMS.txt)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # 已存在：只在还没有产物时补传。重跑工作流通常只是为了刷新说明，
            # 若连产物一起覆盖，已经发布出去的 SHA256 校验和就会被无声改掉。
            HAVE="$(gh release view "$TAG" --json assets -q '.assets | length')"
            if [ "$HAVE" = "0" ]; then
              echo "产物为空，上传"
              gh release upload "$TAG" $FILES --clobber
            else
              echo "产物已存在（$HAVE 个），跳过上传以保持校验和不变"
            fi
            gh release edit "$TAG" --notes-file RELEASE_NOTES.md
          else
            gh release create "$TAG" $FILES \
              --title "NetPuff $V" \
              --notes-file RELEASE_NOTES.md
          fi
